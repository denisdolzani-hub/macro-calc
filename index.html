<body class="text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // =========================================================================
    // 1. COMPENDIO ATTIVITÀ FISICHE DI AINSWORTH (Valori MET Ufficiali)
    // Formula Spesa Netta: EE_netta = (MET - 1.0) * Peso_kg * (Minuti / 60)
    // =========================================================================
    const AINSWORTH_ACTIVITIES = [
      { id: 'weights_vig', label: 'Sala Pesi / Bodybuilding Intenso', met: 6.0, rqCarb: 0.85 },
      { id: 'weights_mod', label: 'Sala Pesi / Forza Moderata', met: 4.5, rqCarb: 0.80 },

      { id: 'run_12', label: 'Corsa Veloce (12 km/h - 5:00 min/km)', met: 11.5, rqCarb: 0.90 },
      { id: 'cycle_mod', label: 'Ciclismo / BDC / MTB Moderato', met: 8.0, rqCarb: 0.85 },
      { id: 'hiking', label: 'Trekking / Escursionismo con dislivello', met: 7.3, rqCarb: 0.75 },
      { id: 'hiit', label: 'HIIT / CrossFit / Circuito Funzionale', met: 8.5, rqCarb: 0.90 },
      { id: 'swim', label: 'Nuoto in vasca (ritmo moderato/vigoroso)', met: 8.3, rqCarb: 0.85 }

    // =========================================================================
    // 2. ALIMENTI FRESCHI BASE (Sempre disponibili anche offline)
    // =========================================================================
    const FRESH_BASE_FOODS = [
      { id: 'f1', name: 'Petto di pollo (crudo)', brand: 'Alimento Fresco', kcal: 110, p: 23.1, c: 0, f: 1.2 },

      { id: 'f4', name: 'Salmone fresco', brand: 'Alimento Fresco', kcal: 208, p: 20.4, c: 0, f: 13.4 },

      { id: 'f8', name: 'Speck Alto Adige IGP', brand: 'Alimento Fresco', kcal: 300, p: 30.7, c: 1.0, f: 19.1 },

      { id: 'f10', name: 'Pasta di semola (cruda)', brand: 'Alimento Fresco', kcal: 353, p: 13.0, c: 72.0, f: 1.5 },
      { id: 'f11', name: 'Fiocchi d\'avena', brand: 'Alimento Fresco', kcal: 373, p: 13.5, c: 58.7, f: 7.0 },
      { id: 'f12', name: 'Patate fresche (crude)', brand: 'Alimento Fresco', kcal: 77, p: 2.0, c: 17.5, f: 0.1 },
      { id: 'f13', name: 'Pane di segale (Vinschgerl)', brand: 'Alimento Fresco', kcal: 245, p: 8.5, c: 46.0, f: 1.8 },
      { id: 'f14', name: 'Olio Extravergine d\'Oliva (EVO)', brand: 'Alimento Fresco', kcal: 899, p: 0, c: 0, f: 99.9 },
      { id: 'f15', name: 'Mandorle / Noci sgusciate', brand: 'Alimento Fresco', kcal: 590, p: 20.0, c: 18.0, f: 52.0 },
      { id: 'f16', name: 'Burro d\'arachidi 100%', brand: 'Alimento Fresco', kcal: 588, p: 25.8, c: 16.0, f: 50.0 },
      { id: 'f17', name: 'Mela dell\'Alto Adige', brand: 'Alimento Fresco', kcal: 52, p: 0.3, c: 13.8, f: 0.2 },
      { id: 'f18', name: 'Banana (sbucciata)', brand: 'Alimento Fresco', kcal: 89, p: 1.1, c: 22.8, f: 0.3 },
      { id: 'f19', name: 'Verdure miste / Zucchine / Insalata', brand: 'Alimento Fresco', kcal: 20, p: 1.5, c: 3.0, f: 0.2 }
    ];

    const MEAL_SLOTS = [
      { id: 'breakfast', label: 'Colazione', emoji: '☕' },
      { id: 'lunch', label: 'Pranzo', emoji: '☀️' },
      { id: 'dinner', label: 'Cena', emoji: '🌙' },
      { id: 'snacks', label: 'Spuntini / Post-Workout', emoji: '🍎' }
    ];

    const EMPTY_DAY_MEALS = { breakfast: [], lunch: [], dinner: [], snacks: [] };
    const EMPTY_DAY_ACTIVITY = { steps: 0, workouts: [] };

    // =========================================================================
    // 3. MOTORE DI SALVATAGGIO LIVELLO 1 (IndexedDB + Persistenza iOS)
    // =========================================================================
    const IDB_NAME = 'MacroCalc_iOS_Vault_v1';
    const IDB_STORE = 'state';

    function openVault() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) return reject('No IDB');
        const req = window.indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function writeIDB(key, val) {
      try {
        const db = await openVault();
        return new Promise((res) => {
          const tx = db.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).put(val, key);
          tx.oncomplete = () => res(true);
          tx.onerror = () => res(false);
        });
      } catch { return false; }
    }

    async function readIDB(key) {
      try {
        const db = await openVault();
        return new Promise((res) => {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const r = tx.objectStore(IDB_STORE).get(key);
          r.onsuccess = () => res(r.result);
          r.onerror = () => res(null);
        });
      } catch { return null; }
    }

    function todayISO() {
      return new Date().toISOString().split('T')[0];
    }

    // Normalizzatore robusto per prodotti OpenFoodFacts (gestisce sia kcal sia kJ)
    function parseOFFProduct(p) {
      const n = p.nutriments || {};
      const prot = Number((n.proteins_100g ?? n.proteins ?? 0).toFixed(1));
      const carb = Number((n.carbohydrates_100g ?? n.carbohydrates ?? 0).toFixed(1));
      const fat = Number((n.fat_100g ?? n.fat ?? 0).toFixed(1));

      let kcal = n['energy-kcal_100g'] ?? n['energy-kcal'] ?? null;
      if (kcal === null && (n['energy-kj_100g'] || n['energy_100g'])) {
        kcal = Math.round(Number(n['energy-kj_100g'] || n['energy_100g']) / 4.184);
      }
      if (kcal === null || isNaN(kcal)) {
        kcal = Math.round(prot * 4 + carb * 4 + fat * 9);
      }

      const name = (p.product_name_it || p.product_name || p.generic_name_it || p.generic_name || '').trim();
      const brand = p.brands ? p.brands.split(',')[0].trim() : 'Commerciale';

      return {
        id: `off_${p.code || Math.random().toString(36).slice(2, 8)}`,
        name,
        brand,
        kcal: Math.max(0, Math.round(Number(kcal) || 0)),
        p: Math.max(0, prot),
        c: Math.max(0, carb),
        f: Math.max(0, fat),
        isOnline: true
      };
    }

    // =========================================================================
    // 4. COMPONENTE PRINCIPALE DELL'APPLICAZIONE
    // =========================================================================
    function App() {
      const [selectedDate, setSelectedDate] = useState(todayISO);
      const [activeTab, setActiveTab] = useState('diary'); // 'diary' | 'training' | 'search' | 'profile' | 'vault'
      const [toast, setToast] = useState(null);

      // Profilo Antropometrico e Strategia
      const [profile, setProfile] = useState(() => {
        const s = localStorage.getItem('mc_ios_profile_v3');
        return s ? JSON.parse(s) : {
          gender: 'male',
          age: 28,
          weight: 75,
          height: 178,
          basePal: 1.2, // Base sedentaria (senza passi/sport per evitare doppio conteggio)
          goalMod: 0,   // 0 = Mantenimento, -0.15 = Cut, +0.10 = Lean Bulk
          gPerKgP: 2.0, // Proteine fisse per kg
          gPerKgF: 0.9  // Grassi base per kg
        };
      });

      // Diario Pasti per Data
      const [mealsByDate, setMealsByDate] = useState(() => {
        const s = localStorage.getItem('mc_ios_meals_by_date_v3');
        return s ? JSON.parse(s) : {};
      });

      // Diario Allenamenti Garmin & Passi per Data
      const [activityByDate, setActivityByDate] = useState(() => {
        const s = localStorage.getItem('mc_ios_activity_by_date_v3');
        return s ? JSON.parse(s) : {};
      });

      // Alimenti Recenti salvati
      const [savedFoods, setSavedFoods] = useState(() => {
        const s = localStorage.getItem('mc_ios_saved_foods_v3');
        return s ? JSON.parse(s) : [];
      });

      // Configurazione Cloud (Livello 3)
      const [cloudCfg, setCloudCfg] = useState(() => {
        const s = localStorage.getItem('mc_ios_cloud_cfg_v3');
        return s ? JSON.parse(s) : { enabled: false, syncId: '' };
      });

      const [vaultStatus, setVaultStatus] = useState({
        persisted: false,
        idbOk: false,
        lastLocal: null,
        lastFile: localStorage.getItem('mc_ios_last_file') || null,
        lastCloud: localStorage.getItem('mc_ios_last_cloud') || null,
        syncing: false
      });

      // Stati Modulo Allenamento Garmin
      const [workoutMode, setWorkoutMode] = useState('garmin'); // 'garmin' | 'met' | 'file'
      const [garminForm, setGarminForm] = useState({ title: 'Allenamento Garmin', activeKcal: '', durationMin: 60, rqCarb: 0.85 });
      const [metForm, setMetForm] = useState({ actId: 'weights_vig', durationMin: 60 });

      // Stati Modulo Ricerca Alimenti
      const [targetMeal, setTargetMeal] = useState('breakfast');
      const [grams, setGrams] = useState(100);
      const [searchMode, setSearchMode] = useState('online'); // 'online' | 'fresh' | 'custom'
      const [query, setQuery] = useState('');
      const [onlineResults, setOnlineResults] = useState([]);
      const [loadingOFF, setLoadingOFF] = useState(false);
      const [searchError, setSearchError] = useState(null);
      const [customFood, setCustomFood] = useState({ name: '', brand: '', kcal: '', p: '', c: '', f: '' });

      const notify = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      // =======================================================================
      // AVVIO: Persistenza iOS + Lettura parametri URL da Comandi Rapidi Apple
      // =======================================================================
      useEffect(() => {
        async function boot() {
          let persisted = false;
          if (navigator.storage && navigator.storage.persist) {
            try {
              persisted = await navigator.storage.persisted();
              if (!persisted) persisted = await navigator.storage.persist();
            } catch {}
          }

          const backupIDB = await readIDB('master_vault_v3');
          if (!localStorage.getItem('mc_ios_meals_by_date_v3') && backupIDB) {
            if (backupIDB.profile) setProfile(backupIDB.profile);
            if (backupIDB.mealsByDate) setMealsByDate(backupIDB.mealsByDate);
            if (backupIDB.activityByDate) setActivityByDate(backupIDB.activityByDate);
            if (backupIDB.savedFoods) setSavedFoods(backupIDB.savedFoods);
            notify('Dati ripristinati da IndexedDB!');
          }
          setVaultStatus(prev => ({ ...prev, persisted, idbOk: true }));

          // Supporto URL Parameters per Comandi Rapidi iOS (?steps=11000&garminKcal=450)
          const params = new URLSearchParams(window.location.search);
          const urlSteps = params.get('steps');
          const urlGarminKcal = params.get('garminKcal');
          if (urlSteps || urlGarminKcal) {
            const d = todayISO();
            setActivityByDate(prev => {
              const cur = prev[d] || EMPTY_DAY_ACTIVITY;
              const nextWorkouts = [...(cur.workouts || [])];
              if (urlGarminKcal && Number(urlGarminKcal) > 0) {
                nextWorkouts.push({
                  id: 'sc_' + Date.now(),
                  title: 'Sync Automatico Garmin/Salute',
                  netKcal: Math.round(Number(urlGarminKcal)),
                  durationMin: 0,
                  rqCarb: 0.85,
                  source: 'Apple Salute / Garmin'
                });
              }
              return {
                ...prev,
                [d]: {
                  steps: urlSteps ? Math.max(0, Number(urlSteps)) : cur.steps,
                  workouts: nextWorkouts
                }
              };
            });
            window.history.replaceState({}, document.title, window.location.pathname);
            notify('Attività sincronizzata da Apple Salute / Garmin!');
          }
        }
        boot();
      }, []);

      // Salvataggio continuo Livello 1 (LocalStorage + IndexedDB)
      useEffect(() => {
        const now = new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
        localStorage.setItem('mc_ios_profile_v3', JSON.stringify(profile));
        localStorage.setItem('mc_ios_meals_by_date_v3', JSON.stringify(mealsByDate));
        localStorage.setItem('mc_ios_activity_by_date_v3', JSON.stringify(activityByDate));
        localStorage.setItem('mc_ios_saved_foods_v3', JSON.stringify(savedFoods));
        localStorage.setItem('mc_ios_cloud_cfg_v3', JSON.stringify(cloudCfg));

        writeIDB('master_vault_v3', {
          profile,
          mealsByDate,
          activityByDate,
          savedFoods,
          updatedAt: new Date().toISOString()
        }).then(ok => setVaultStatus(prev => ({ ...prev, idbOk: ok, lastLocal: now })));
      }, [profile, mealsByDate, activityByDate, savedFoods, cloudCfg]);

      // =======================================================================
      // MOTORE DI RICERCA OPENFOODFACTS (Con doppio server + pulsante manuale)
      // =======================================================================
      const executeOnlineSearch = async (rawQuery) => {
        const q = (rawQuery ?? query).trim();
        if (q.length < 2) {
          setOnlineResults([]);
          setSearchError(null);
          return;
        }
        setLoadingOFF(true);
        setSearchError(null);

        try {
          const isBarcode = /^\d{8,14}$/.test(q);
          let rawProducts = [];

          if (isBarcode) {
            const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${q}.json`);
            const d = await r.json();
            if (d && d.product) rawProducts = [d.product];
          } else {
            // Tentativo 1: Server Globale con filtro lingua/prodotti (più veloce e stabile)
            try {
              const urlIt = `https://it.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=24`;
              const r1 = await fetch(urlIt);
              const d1 = await r1.json();
              rawProducts = d1.products || [];
            } catch {
              rawProducts = [];
            }

            // Fallback automatico sul server mondiale se il nodo .it è lento o vuoto
            if (rawProducts.length === 0) {
              const urlWorld = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=24`;
              const r2 = await fetch(urlWorld);
              const d2 = await r2.json();
              rawProducts = d2.products || [];
            }
          }

          const parsed = rawProducts
            .map(parseOFFProduct)
            .filter(item => item.name.length > 0 && (item.kcal > 0 || item.p > 0 || item.c > 0 || item.f > 0));

          setOnlineResults(parsed);
          if (parsed.length === 0) {
            setSearchError(`Nessun risultato trovato per "${q}". Prova con il nome del marchio o usa il tab Freschi/Crea.`);
          }
        } catch (err) {
          setSearchError('Impossibile contattare OpenFoodFacts. Se stai aprendo il file da PC con doppio clic (file://), caricalo su GitHub Pages per sbloccare la rete.');
        } finally {
          setLoadingOFF(false);
        }
      };

      useEffect(() => {
        if (searchMode !== 'online') return;
        if (query.trim().length < 2) {
          setOnlineResults([]);
          setSearchError(null);
          return;
        }
        const t = setTimeout(() => executeOnlineSearch(query), 450);
        return () => clearTimeout(t);
      }, [query, searchMode]);

      // =======================================================================
      // MODELLO BIOENERGETICO: BMR + Passi (Margaria) + Sport (MET/Garmin)
      // =======================================================================
      const dayActivity = activityByDate[selectedDate] || EMPTY_DAY_ACTIVITY;

      const bioenergetics = useMemo(() => {
        const w = Number(profile.weight) || 75;
        const h = Number(profile.height) || 178;
        const a = Number(profile.age) || 28;

        // 1. Metabolismo Basale (Mifflin-St Jeor)
        const bmr = Math.round(10 * w + 6.25 * h - 5 * a + (profile.gender === 'male' ? 5 : -161));

        // 2. Spesa Sedentaria di Base (PAL = 1.20 di default)
        const baseSedentaryTdee = Math.round(bmr * Number(profile.basePal || 1.2));

        // 3. Spesa Cinematica Netta dei Passi (Margaria / di Prampero: 0.5 kcal/kg/km)
        const steps = Math.max(0, Number(dayActivity.steps) || 0);
        const stepLengthMeters = (0.415 * h) / 100;
        const distanceKm = (steps * stepLengthMeters) / 1000;
        const stepsNetKcal = Math.round(0.5 * w * distanceKm);

        // Ripartizione substrati Passi (RQ ~ 0.78 -> 60% CHO, 40% FAT)
        const stepsExtraCarbG = (stepsNetKcal * 0.60) / 4;
        const stepsExtraFatG = (stepsNetKcal * 0.40) / 9;

        // 4. Spesa Netta Allenamenti Garmin / MET
        let workoutsNetKcal = 0;
        let workoutsExtraCarbG = 0;
        let workoutsExtraFatG = 0;

        (dayActivity.workouts || []).forEach(wk => {
          const k = Number(wk.netKcal) || 0;
          const rqRatio = Number(wk.rqCarb) || 0.85; // Default 85% Glicogeno/Carboidrati
          workoutsNetKcal += k;
          workoutsExtraCarbG += (k * rqRatio) / 4;
          workoutsExtraFatG += (k * (1 - rqRatio)) / 9;
        });

        // 5. TDEE Reale Giornaliero & Applicazione Obiettivo (Cut / Mantenimento / Bulk)
        const totalExpenditure = baseSedentaryTdee + stepsNetKcal + workoutsNetKcal;
        const targetBaseKcal = Math.round(baseSedentaryTdee * (1 + Number(profile.goalMod || 0)));
        const finalTargetKcal = targetBaseKcal + stepsNetKcal + workoutsNetKcal;

        // 6. Calcolo Grammi Macronutrienti Dinamici
        const baseProteinG = Math.round(w * Number(profile.gPerKgP || 2.0));
        const baseFatG = Math.round(w * Number(profile.gPerKgF || 0.9));
        const baseCarbG = Math.max(0, Math.round((targetBaseKcal - (baseProteinG * 4 + baseFatG * 9)) / 4));

        const finalProteinG = baseProteinG;
        const finalCarbG = Math.max(0, Math.round(baseCarbG + stepsExtraCarbG + workoutsExtraCarbG));
        const finalFatG = Math.max(0, Math.round(baseFatG + stepsExtraFatG + workoutsExtraFatG));

        return {
          bmr,
          baseSedentaryTdee,
          distanceKm: distanceKm.toFixed(2),
          stepsNetKcal,
          workoutsNetKcal: Math.round(workoutsNetKcal),
          totalExtraKcal: stepsNetKcal + Math.round(workoutsNetKcal),
          totalExtraCarbG: Math.round(stepsExtraCarbG + workoutsExtraCarbG),
          totalExtraFatG: Math.round(stepsExtraFatG + workoutsExtraFatG),
          totalExpenditure,
          kcal: finalTargetKcal,
          p: finalProteinG,
          c: finalCarbG,
          f: finalFatG
        };
      }, [profile, dayActivity]);

      // =======================================================================
      // CALCOLO CONSUMI PASTI DEL GIORNO
      // =======================================================================
      const dayMeals = mealsByDate[selectedDate] || EMPTY_DAY_MEALS;

      const consumed = useMemo(() => {
        let kcal = 0, p = 0, c = 0, f = 0;
        const bySlot = {};
        MEAL_SLOTS.forEach(s => {
          let sk = 0, sp = 0, sc = 0, sf = 0;
          (dayMeals[s.id] || []).forEach(item => {
            const r = (Number(item.grams) || 0) / 100;
            sk += item.kcal * r; sp += item.p * r; sc += item.c * r; sf += item.f * r;
          });
          bySlot[s.id] = { kcal: Math.round(sk), p: sp.toFixed(1), c: sc.toFixed(1), f: sf.toFixed(1) };
          kcal += sk; p += sp; c += sc; f += sf;
        });
        return { kcal: Math.round(kcal), p: Math.round(p), c: Math.round(c), f: Math.round(f), bySlot };
      }, [dayMeals]);

      // =======================================================================
      // AZIONI DIARIO PASTI & ALLENAMENTI GARMIN
      // =======================================================================
      const setStepsForDay = (val) => {
        const clean = Math.max(0, Number(val) || 0);
        setActivityByDate(prev => ({
          ...prev,
          [selectedDate]: { ...(prev[selectedDate] || EMPTY_DAY_ACTIVITY), steps: clean }
        }));
      };

      const addGarminDirectWorkout = (e) => {
        e.preventDefault();
        const k = Math.round(Number(garminForm.activeKcal) || 0);
        if (k <= 0) return notify('Inserisci le Calorie Attive lette sul tuo Garmin');

        const newWk = {
          id: 'wk_' + Date.now(),
          title: garminForm.title.trim() || 'Sessione Garmin',
          netKcal: k,
          durationMin: Number(garminForm.durationMin) || 0,
          rqCarb: Number(garminForm.rqCarb) || 0.85,
          source: 'Garmin Connect (Calorie Attive)'
        };

        setActivityByDate(prev => {
          const cur = prev[selectedDate] || EMPTY_DAY_ACTIVITY;
          return { ...prev, [selectedDate]: { ...cur, workouts: [...(cur.workouts || []), newWk] } };
        });
        setGarminForm({ ...garminForm, activeKcal: '' });
        notify(`Allenamento aggiunto: +${k} kcal netti!`);
      };

      const addMetScientificWorkout = (e) => {
        e.preventDefault();
        const act = AINSWORTH_ACTIVITIES.find(a => a.id === metForm.actId) || AINSWORTH_ACTIVITIES[0];
        const mins = Math.max(1, Number(metForm.durationMin) || 60);
        const w = Number(profile.weight) || 75;

        // Formula scientifica netta: (MET - 1) * kg * (min / 60)
        const netKcal = Math.round((act.met - 1.0) * w * (mins / 60));

        const newWk = {
          id: 'wk_' + Date.now(),
          title: `${act.label} (${mins} min)`,
          netKcal,
          durationMin: mins,
          rqCarb: act.rqCarb,
          source: `Modello Ainsworth (${act.met} MET)`
        };

        setActivityByDate(prev => {
          const cur = prev[selectedDate] || EMPTY_DAY_ACTIVITY;
          return { ...prev, [selectedDate]: { ...cur, workouts: [...(cur.workouts || []), newWk] } };
        });
        notify(`Aggiunto ${act.label}: +${netKcal} kcal netti!`);
      };

      // Parser per file .TCX / .GPX esportati da Garmin Connect
      const handleGarminFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const text = ev.target.result || '';
          // Estrazione tag <Calories> nei file TCX Garmin
          const calMatches = [...text.matchAll(/<Calories>(\d+)<\/Calories>/gi)];
          let totalKcal = calMatches.reduce((acc, m) => acc + Number(m[1] || 0), 0);

          // Estrazione durata <TotalTimeSeconds>
          const timeMatches = [...text.matchAll(/<TotalTimeSeconds>([\d.]+)<\/TotalTimeSeconds>/gi)];
          let totalSec = timeMatches.reduce((acc, m) => acc + Number(m[1] || 0), 0);
          const mins = totalSec > 0 ? Math.round(totalSec / 60) : 60;

          if (totalKcal <= 0) {
            // Se è un GPX senza tag calorie, stima da durata
            const w = Number(profile.weight) || 75;
            totalKcal = Math.round((7.5 - 1.0) * w * (mins / 60));
          }

          const newWk = {
            id: 'wk_' + Date.now(),
            title: `File Garmin: ${file.name.replace(/\.(tcx|gpx|fit)$/i, '')}`,
            netKcal: totalKcal,
            durationMin: mins,
            rqCarb: 0.85,
            source: 'File Garmin Importato'
          };

          setActivityByDate(prev => {
            const cur = prev[selectedDate] || EMPTY_DAY_ACTIVITY;
            return { ...prev, [selectedDate]: { ...cur, workouts: [...(cur.workouts || []), newWk] } };
          });
          notify(`File Garmin importato: +${totalKcal} kcal!`);
        };
        reader.readAsText(file);
      };

      const removeWorkout = (wkId) => {
        setActivityByDate(prev => {
          const cur = prev[selectedDate] || EMPTY_DAY_ACTIVITY;
          return {
            ...prev,
            [selectedDate]: { ...cur, workouts: (cur.workouts || []).filter(w => w.id !== wkId) }
          };
        });
      };

      const addFood = (food) => {
        const g = Math.max(1, Number(grams) || 100);
        const entry = { ...food, uid: `${Date.now()}_${Math.random().toString(36).slice(2, 6)}`, grams: g };
        const updatedDay = { ...dayMeals, [targetMeal]: [...(dayMeals[targetMeal] || []), entry] };
        setMealsByDate(prev => ({ ...prev, [selectedDate]: updatedDay }));

        if (food.isOnline) {
          setSavedFoods(prev => {
            const exists = prev.some(x => x.name.toLowerCase() === food.name.toLowerCase());
            return exists ? prev : [food, ...prev].slice(0, 50);
          });
        }
        notify(`Aggiunto in ${MEAL_SLOTS.find(m => m.id === targetMeal)?.label}!`);
      };

      const updateGrams = (slotId, uid, newG) => {
        const updatedDay = {
          ...dayMeals,
          [slotId]: dayMeals[slotId].map(i => i.uid === uid ? { ...i, grams: Math.max(0, Number(newG) || 0) } : i)
        };
        setMealsByDate(prev => ({ ...prev, [selectedDate]: updatedDay }));
      };

      const removeFood = (slotId, uid) => {
        const updatedDay = {
          ...dayMeals,
          [slotId]: dayMeals[slotId].filter(i => i.uid !== uid)
        };
        setMealsByDate(prev => ({ ...prev, [selectedDate]: updatedDay }));
      };

      // =======================================================================
      // LIVELLO 2 & LIVELLO 3: Backup File JSON / iCloud & Cloud Sync
      // =======================================================================
      const exportJSONBackup = async () => {
        const dataStr = JSON.stringify({
          profile,
          mealsByDate,
          activityByDate,
          savedFoods,
          exportedAt: new Date().toISOString()
        }, null, 2);
        const fileName = `MacroCalc_Backup_${selectedDate}.json`;

        if (navigator.canShare) {
          try {
            const file = new File([dataStr], fileName, { type: 'application/json' });
            if (navigator.canShare({ files: [file] })) {
              await navigator.share({ title: 'Backup MacroCalc iOS', files: [file] });
              const now = new Date().toLocaleDateString('it-IT');
              localStorage.setItem('mc_ios_last_file', now);
              setVaultStatus(prev => ({ ...prev, lastFile: now }));
              notify('Salvato su File / iCloud Drive!');
              return;
            }
          } catch {}
        }

        const blob = new Blob([dataStr], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = fileName;
        a.click();
        const now = new Date().toLocaleDateString('it-IT');
        localStorage.setItem('mc_ios_last_file', now);
        setVaultStatus(prev => ({ ...prev, lastFile: now }));
        notify('File Backup scaricato!');
      };

      const importJSONBackup = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const d = JSON.parse(ev.target.result);
            if (d.profile) setProfile(d.profile);
            if (d.mealsByDate) setMealsByDate(d.mealsByDate);
            if (d.activityByDate) setActivityByDate(d.activityByDate);
            if (d.savedFoods) setSavedFoods(d.savedFoods);
            notify('Backup ripristinato con successo!');
          } catch { notify('File JSON non valido'); }
        };
        reader.readAsText(file);
      };

      const pushCloud = async () => {
        setVaultStatus(prev => ({ ...prev, syncing: true }));
        try {
          const payload = { profile, mealsByDate, activityByDate, savedFoods, updatedAt: new Date().toISOString() };
          if (cloudCfg.syncId) {
            const r = await fetch(`https://jsonblob.com/api/jsonBlob/${cloudCfg.syncId}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
              body: JSON.stringify(payload)
            });
            if (!r.ok) throw new Error();
          } else {
            const r = await fetch('https://jsonblob.com/api/jsonBlob', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
              body: JSON.stringify(payload)
            });
            const loc = r.headers.get('Location') || r.headers.get('location') || '';
            const newId = loc.split('/').pop();
            if (newId) setCloudCfg({ enabled: true, syncId: newId });
          }
          const now = new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
          localStorage.setItem('mc_ios_last_cloud', now);
          setVaultStatus(prev => ({ ...prev, syncing: false, lastCloud: now }));
          notify('Sincronizzato sul Cloud!');
        } catch {
          setVaultStatus(prev => ({ ...prev, syncing: false }));
          notify('Errore di connessione al Cloud');
        }
      };

      const pullCloud = async () => {
        if (!cloudCfg.syncId) return notify('Inserisci prima il tuo Codice Cloud ID');
        setVaultStatus(prev => ({ ...prev, syncing: true }));
        try {
          const r = await fetch(`https://jsonblob.com/api/jsonBlob/${cloudCfg.syncId}`);
          const d = await r.json();
          if (d.profile) setProfile(d.profile);
          if (d.mealsByDate) setMealsByDate(d.mealsByDate);
          if (d.activityByDate) setActivityByDate(d.activityByDate);
          if (d.savedFoods) setSavedFoods(d.savedFoods);
          setVaultStatus(prev => ({ ...prev, syncing: false }));
          notify('Dati scaricati dal Cloud!');
        } catch {
          setVaultStatus(prev => ({ ...prev, syncing: false }));
          notify('Codice Cloud non trovato');
        }
      };

      const pct = (v, m) => m > 0 ? Math.min(100, Math.round((v / m) * 100)) : 0;

      return (
        <div className="max-w-lg mx-auto px-3.5 pt-3">
          {toast && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-emerald-600 text-white text-xs font-bold px-4 py-2.5 rounded-2xl shadow-xl">
              {toast}
            </div>
          )}

          {/* HEADER + WIDGET BIOENERGETICO DINAMICO */}
          <header className="bg-slate-900 text-white p-4 rounded-3xl shadow-lg mb-3.5">
            <div className="flex items-center justify-between mb-2.5">
              <div>
                <h1 className="font-extrabold text-base tracking-tight flex items-center gap-1.5">
                  <span>MacroCalc Pro</span>
                  <span className="text-[10px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-full">
                    Garmin & MET
                  </span>
                </h1>
                <p className="text-[11px] text-slate-400">
                  Base: {bioenergetics.baseSedentaryTdee} kcal • Extra Sport/Passi:{' '}
                  <strong className="text-emerald-400">+{bioenergetics.totalExtraKcal} kcal</strong>
                </p>
              </div>
              <input
                type="date"
                value={selectedDate}
                onChange={e => setSelectedDate(e.target.value)}
                className="bg-slate-800 text-white text-xs font-bold px-2.5 py-1.5 rounded-xl border border-slate-700"
              />
            </div>

            {/* BARRE MACRO CON COMPENSAZIONE AUTOMATICA */}
            <div className="grid grid-cols-4 gap-2 bg-slate-800/90 p-3 rounded-2xl text-center">
              <div>
                <div className="text-[10px] text-slate-400 font-bold uppercase">Kcal</div>
                <div className="text-sm font-extrabold text-white">
                  {consumed.kcal}<span className="text-[10px] text-slate-400">/{bioenergetics.kcal}</span>
                </div>
                <div className="w-full h-1.5 bg-slate-700 rounded-full mt-1 overflow-hidden">
                  <div className="h-full bg-emerald-400 transition-all" style={{ width: `${pct(consumed.kcal, bioenergetics.kcal)}%` }} />
                </div>
              </div>
              <div>
                <div className="text-[10px] text-blue-400 font-bold uppercase">Prot</div>
                <div className="text-sm font-extrabold text-white">
                  {consumed.p}<span className="text-[10px] text-slate-400">/{bioenergetics.p}g</span>
                </div>
                <div className="w-full h-1.5 bg-slate-700 rounded-full mt-1 overflow-hidden">
                  <div className="h-full bg-blue-400 transition-all" style={{ width: `${pct(consumed.p, bioenergetics.p)}%` }} />
                </div>
              </div>
              <div>
                <div className="text-[10px] text-amber-400 font-bold uppercase">
                  Carb {bioenergetics.totalExtraCarbG > 0 && <span className="text-emerald-400">(+{bioenergetics.totalExtraCarbG})</span>}
                </div>
                <div className="text-sm font-extrabold text-white">
                  {consumed.c}<span className="text-[10px] text-slate-400">/{bioenergetics.c}g</span>
                </div>
                <div className="w-full h-1.5 bg-slate-700 rounded-full mt-1 overflow-hidden">
                  <div className="h-full bg-amber-400 transition-all" style={{ width: `${pct(consumed.c, bioenergetics.c)}%` }} />
                </div>
              </div>
              <div>
                <div className="text-[10px] text-rose-400 font-bold uppercase">
                  Grassi {bioenergetics.totalExtraFatG > 0 && <span className="text-emerald-400">(+{bioenergetics.totalExtraFatG})</span>}
                </div>
                <div className="text-sm font-extrabold text-white">
                  {consumed.f}<span className="text-[10px] text-slate-400">/{bioenergetics.f}g</span>
                </div>
                <div className="w-full h-1.5 bg-slate-700 rounded-full mt-1 overflow-hidden">
                  <div className="h-full bg-rose-400 transition-all" style={{ width: `${pct(consumed.f, bioenergetics.f)}%` }} />
                </div>
              </div>
            </div>
          </header>

          {/* =================================================================
              TAB 1: DIARIO ALIMENTARE + BARRA RAPIDA PASSI
          ================================================================= */}
          {activeTab === 'diary' && (
            <div className="space-y-3">
              {/* Barra rapida Passi & Stato Allenamento del giorno */}
              <div className="bg-white rounded-2xl p-3.5 shadow-sm border border-emerald-500/30 flex items-center justify-between gap-2">
                <div className="flex items-center gap-2.5">
                  <span className="text-xl">⌚</span>
                  <div>
                    <div className="text-xs font-extrabold text-slate-800">
                      Passi Oggi: {dayActivity.steps || 0} ({bioenergetics.distanceKm} km)
                    </div>
                    <div className="text-[11px] text-slate-500">
                      Passi: <strong>+{bioenergetics.stepsNetKcal} kcal</strong> • Sport: <strong>+{bioenergetics.workoutsNetKcal} kcal</strong>
                    </div>
                  </div>
                </div>
                <button
                  onClick={() => setActiveTab('training')}
                  className="bg-emerald-600 text-white text-xs font-bold px-3 py-2 rounded-xl shrink-0"
                >
                  Gestisci Sport
                </button>
              </div>

              {MEAL_SLOTS.map(slot => {
                const items = dayMeals[slot.id] || [];
                const st = consumed.bySlot[slot.id] || { kcal: 0, p: 0, c: 0, f: 0 };
                return (
                  <div key={slot.id} className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80">
                    <div className="flex justify-between items-center mb-2.5">
                      <div>
                        <h2 className="font-extrabold text-sm text-slate-900">{slot.emoji} {slot.label}</h2>
                        <p className="text-[11px] text-slate-500">
                          <strong>{st.kcal} kcal</strong> • P:{st.p}g C:{st.c}g F:{st.f}g
                        </p>
                      </div>
                      <button
                        onClick={() => { setTargetMeal(slot.id); setActiveTab('search'); }}
                        className="bg-slate-900 text-white text-xs font-bold px-3 py-1.5 rounded-xl"
                      >
                        + Aggiungi
                      </button>
                    </div>

                    {items.length === 0 ? (
                      <p className="text-xs text-slate-400 italic">Nessun alimento inserito</p>
                    ) : (
                      <div className="space-y-2 pt-1">
                        {items.map(item => {
                          const r = item.grams / 100;
                          return (
                            <div key={item.uid} className="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border border-slate-200/60">
                              <div className="min-w-0 pr-2">
                                <div className="text-xs font-bold text-slate-900 truncate">{item.name}</div>
                                <div className="text-[10px] text-slate-500">
                                  {item.brand} • <strong>{Math.round(item.kcal * r)} kcal</strong> (P:{(item.p * r).toFixed(1)} C:{(item.c * r).toFixed(1)} F:{(item.f * r).toFixed(1)})
                                </div>
                              </div>
                              <div className="flex items-center gap-1.5 shrink-0">
                                <input
                                  type="number"
                                  value={item.grams}
                                  onChange={e => updateGrams(slot.id, item.uid, e.target.value)}
                                  className="w-14 text-center text-xs font-bold bg-white border border-slate-300 rounded-lg py-1"
                                />
                                <span className="text-[10px] text-slate-500 font-bold">g</span>
                                <button
                                  onClick={() => removeFood(slot.id, item.uid)}
                                  className="text-rose-500 font-bold text-xs px-1.5"
                                >
                                  ✕
                                </button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          {/* =================================================================
              TAB 2: ALLENAMENTO GARMIN & BIOENERGETICA (MARGARIA + MET)
          ================================================================= */}
          {activeTab === 'training' && (
            <div className="space-y-3.5">
              {/* 1. SEZIONE PASSI GIORNALIERI (Modello Cinematica Margaria) */}
              <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-2.5">
                <div className="flex items-center justify-between">
                  <span className="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded bg-emerald-100 text-emerald-800">
                    Locomozione • Equazione di Margaria
                  </span>
                  <span className="text-xs font-bold text-emerald-600">+{bioenergetics.stepsNetKcal} kcal nette</span>
                </div>
                <h2 className="font-extrabold text-sm text-slate-900">👟 Passi Giornalieri (Garmin / Apple Salute)</h2>
                <p className="text-[11px] text-slate-500">
                  Falcata stimata: <strong>{((0.415 * profile.height) / 100).toFixed(2)} m</strong> • Distanza: <strong>{bioenergetics.distanceKm} km</strong> • Costo netto: $0.5\text{ kcal/kg/km}$.
                </p>

                <div className="flex items-center gap-2 pt-1">
                  <input
                    type="number"
                    step="500"
                    value={dayActivity.steps || ''}
                    onChange={e => setStepsForDay(e.target.value)}
                    placeholder="Es. 10000"
                    className="flex-1 px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm font-extrabold"
                  />
                  {[6000, 10000, 14000].map(val => (
                    <button
                      key={val}
                      onClick={() => setStepsForDay(val)}
                      className="px-2.5 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-xs font-bold text-slate-700"
                    >
                      {val / 1000}k
                    </button>
                  ))}
                </div>
              </div>

              {/* 2. AGGIUNGI SESSIONE DI ALLENAMENTO (3 Modalità) */}
              <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
                <h2 className="font-extrabold text-sm text-slate-900">⌚ Registra Allenamento del Giorno</h2>

                <div className="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-xl text-xs font-bold">
                  <button
                    onClick={() => setWorkoutMode('garmin')}
                    className={`py-1.5 rounded-lg ${workoutMode === 'garmin' ? 'bg-white shadow text-emerald-700' : 'text-slate-500'}`}
                  >
                    ⌚ Kcal Garmin
                  </button>
                  <button
                    onClick={() => setWorkoutMode('met')}
                    className={`py-1.5 rounded-lg ${workoutMode === 'met' ? 'bg-white shadow text-emerald-700' : 'text-slate-500'}`}
                  >
                    🔬 Calcolo MET
                  </button>
                  <button
                    onClick={() => setWorkoutMode('file')}
                    className={`py-1.5 rounded-lg ${workoutMode === 'file' ? 'bg-white shadow text-emerald-700' : 'text-slate-500'}`}
                  >
                    📂 File / iOS
                  </button>
                </div>

                {/* Modalità A: Inserimento diretto Calorie Attive lette su Garmin Connect */}
                {workoutMode === 'garmin' && (
                  <form onSubmit={addGarminDirectWorkout} className="space-y-2.5">
                    <p className="text-[11px] text-slate-500">
                      Inserisci le <strong>Calorie Attive</strong> calcolate dal tuo orologio Garmin (algoritmo Firstbeat HR/HRV).
                    </p>
                    <div className="grid grid-cols-2 gap-2">
                      <input
                        type="text"
                        value={garminForm.title}
                        onChange={e => setGarminForm({ ...garminForm, title: e.target.value })}
                        placeholder="Nome (es. Corsa / Pesi)"
                        className="px-3 py-2 bg-slate-50 border rounded-xl text-xs font-bold"
                      />
                      <input
                        type="number"
                        required
                        value={garminForm.activeKcal}
                        onChange={e => setGarminForm({ ...garminForm, activeKcal: e.target.value })}
                        placeholder="Calorie Attive Garmin (kcal)"
                        className="px-3 py-2 bg-slate-50 border border-emerald-400 rounded-xl text-xs font-extrabold"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-600 mb-1">
                        Intensità / Quoziente Respiratorio ($RQ$):
                      </label>
                      <select
                        value={garminForm.rqCarb}
                        onChange={e => setGarminForm({ ...garminForm, rqCarb: Number(e.target.value) })}
                        className="w-full px-3 py-2 bg-slate-50 border rounded-xl text-xs font-bold"
                      >
                        <option value={0.90}>Alta Intensità / Soglia / HIIT (90% Carboidrati / 10% Grassi)</option>
                        <option value={0.85}>Sala Pesi / Corsa / Bici (85% Carboidrati / 15% Grassi)</option>
                        <option value={0.70}>Endurance Z2 / Montagna (70% Carboidrati / 30% Grassi)</option>
                      </select>
                    </div>
                    <button type="submit" className="w-full py-2.5 bg-emerald-600 text-white font-bold text-xs rounded-xl">
                      + Aggiungi Allenamento Garmin
                    </button>
                  </form>
                )}

                {/* Modalità B: Calcolo Analitico MET di Ainsworth */}
                {workoutMode === 'met' && (
                  <form onSubmit={addMetScientificWorkout} className="space-y-2.5">
                    <p className="text-[11px] text-slate-500">
                      Calcolo scientifico netto: $(\text{MET} - 1) \times {profile.weight}\text{ kg} \times (\text{min}/60)$.
                    </p>
                    <select
                      value={metForm.actId}
                      onChange={e => setMetForm({ ...metForm, actId: e.target.value })}
                      className="w-full px-3 py-2 bg-slate-50 border rounded-xl text-xs font-bold"
                    >
                      {AINSWORTH_ACTIVITIES.map(a => (
                        <option key={a.id} value={a.id}>{a.label} ({a.met} MET)</option>
                      ))}
                    </select>
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-bold text-slate-600">Durata (minuti):</span>
                      <input
                        type="number"
                        value={metForm.durationMin}
                        onChange={e => setMetForm({ ...metForm, durationMin: e.target.value })}
                        className="w-24 px-3 py-2 bg-slate-50 border rounded-xl text-xs font-extrabold text-center"
                      />
                    </div>
                    <button type="submit" className="w-full py-2.5 bg-slate-900 text-white font-bold text-xs rounded-xl">
                      + Calcola e Aggiungi Sessione MET
                    </button>
                  </form>
                )}

                {/* Modalità C: File .TCX/.GPX Garmin + Comandi Rapidi iOS */}
                {workoutMode === 'file' && (
                  <div className="space-y-3 text-xs">
                    <label className="block w-full py-3 px-4 border-2 border-dashed border-emerald-400 bg-emerald-50/40 rounded-xl text-center font-bold text-emerald-800 cursor-pointer">
                      📂 Carica File Attività Garmin (.TCX o .GPX)
                      <input type="file" accept=".tcx,.gpx" onChange={handleGarminFileUpload} className="hidden" />
                    </label>
                    <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-1 text-[11px] text-slate-600">
                      <div className="font-bold text-slate-800">⚡ Automatismo Comandi Rapidi iOS (Salute / Garmin):</div>
                      <p>
                        Nell'app <strong>Comandi Rapidi</strong> di iPhone puoi creare un'azione <em>"Trova campioni Salute (Passi e Energia Attiva)"</em> e aprire l'URL:
                      </p>
                      <code className="block bg-slate-900 text-emerald-300 p-2 rounded-lg text-[10px] break-all">
                        {window.location.origin + window.location.pathname}?steps=10000&garminKcal=450
                      </code>
                    </div>
                  </div>
                )}
              </div>

              {/* 3. ELENCO ALLENAMENTI REGISTRATI OGGI */}
              <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-2">
                <h3 className="font-extrabold text-xs uppercase text-slate-500">
                  Sessioni Registrate ({selectedDate})
                </h3>
                {(dayActivity.workouts || []).length === 0 ? (
                  <p className="text-xs text-slate-400 italic">Nessun allenamento specifico registrato oggi.</p>
                ) : (
                  <div className="space-y-2">
                    {dayActivity.workouts.map(wk => (
                      <div key={wk.id} className="flex items-center justify-between p-2.5 bg-slate-50 rounded-xl border border-slate-200">
                        <div>
                          <div className="text-xs font-bold text-slate-900">{wk.title}</div>
                          <div className="text-[10px] text-slate-500">
                            {wk.source} • <strong>+{wk.netKcal} kcal nette</strong> (+{Math.round((wk.netKcal * (wk.rqCarb || 0.85)) / 4)}g Carboidrati)
                          </div>
                        </div>
                        <button onClick={() => removeWorkout(wk.id)} className="text-rose-500 font-bold text-xs px-2">
                          ✕
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* =================================================================
              TAB 3: RICERCA ALIMENTI (OPENFOODFACTS CON PULSANTE + FRESCHI)
          ================================================================= */}
          {activeTab === 'search' && (
            <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
              <div className="flex items-center justify-between gap-2">
                <select
                  value={targetMeal}
                  onChange={e => setTargetMeal(e.target.value)}
                  className="flex-1 bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold"
                >
                  {MEAL_SLOTS.map(s => <option key={s.id} value={s.id}>{s.emoji} Aggiungi in {s.label}</option>)}
                </select>
                <div className="flex items-center gap-1 bg-slate-100 border border-slate-200 rounded-xl px-2.5 py-1.5">
                  <input
                    type="number"
                    value={grams}
                    onChange={e => setGrams(e.target.value)}
                    className="w-14 text-center text-xs font-bold bg-transparent"
                  />
                  <span className="text-xs font-bold text-slate-500">g</span>
                </div>
              </div>

              <div className="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-xl text-xs font-bold">
                <button onClick={() => setSearchMode('online')} className={`py-1.5 rounded-lg ${searchMode === 'online' ? 'bg-white shadow text-emerald-700' : 'text-slate-500'}`}>🌍 Marche Live</button>
                <button onClick={() => setSearchMode('fresh')} className={`py-1.5 rounded-lg ${searchMode === 'fresh' ? 'bg-white shadow text-emerald-700' : 'text-slate-500'}`}>🥩 Freschi/Recenti</button>
                <button onClick={() => setSearchMode('custom')} className={`py-1.5 rounded-lg ${searchMode === 'custom' ? 'bg-white shadow text-emerald-700' : 'text-slate-500'}`}>➕ Crea</button>
              </div>

              {searchMode === 'online' && (
                <div className="space-y-2.5">
                  <form
                    onSubmit={(e) => { e.preventDefault(); executeOnlineSearch(query); }}
                    className="flex gap-1.5"
                  >
                    <input
                      type="text"
                      value={query}
                      onChange={e => setQuery(e.target.value)}
                      placeholder="Cerca marca, lasagna, cereali o codice EAN..."
                      className="flex-1 px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm"
                    />
                    <button
                      type="submit"
                      className="px-4 py-2.5 bg-emerald-600 text-white font-bold text-xs rounded-xl shrink-0"
                    >
                      Cerca
                    </button>
                  </form>

                  {loadingOFF && (
                    <p className="text-xs text-center text-emerald-700 font-semibold py-3">
                      Ricerca in corso su OpenFoodFacts...
                    </p>
                  )}

                  {searchError && (
                    <div className="p-3 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-xl">
                      {searchError}
                    </div>
                  )}

                  <div className="space-y-2 max-h-96 overflow-y-auto">
                    {onlineResults.map(item => {
                      const r = (Number(grams) || 100) / 100;
                      return (
                        <div key={item.id} className="p-2.5 rounded-xl border border-slate-200 flex justify-between items-center gap-2">
                          <div className="min-w-0">
                            <div className="text-xs font-bold text-slate-900 truncate">{item.name}</div>
                            <div className="text-[10px] text-slate-500">
                              <strong className="text-emerald-700">{item.brand}</strong> • Per {grams}g:{' '}
                              <strong>{Math.round(item.kcal * r)} kcal</strong> (P:{(item.p * r).toFixed(1)} C:{(item.c * r).toFixed(1)} F:{(item.f * r).toFixed(1)})
                            </div>
                          </div>
                          <button onClick={() => addFood(item)} className="bg-emerald-600 text-white text-xs font-bold px-3 py-1.5 rounded-xl shrink-0">
                            + Aggiungi
                          </button>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {searchMode === 'fresh' && (
                <div className="space-y-2 max-h-96 overflow-y-auto">
                  {savedFoods.length > 0 && (
                    <div className="text-[10px] font-bold uppercase text-emerald-700 pt-1">I Tuoi Prodotti Recenti</div>
                  )}
                  {savedFoods.map(item => (
                    <div key={item.id} className="p-2.5 rounded-xl border border-emerald-200 bg-emerald-50/40 flex justify-between items-center">
                      <div>
                        <div className="text-xs font-bold">{item.name}</div>
                        <div className="text-[10px] text-slate-500">{item.brand} • {item.kcal} kcal/100g</div>
                      </div>
                      <button onClick={() => addFood(item)} className="bg-emerald-600 text-white text-xs font-bold px-3 py-1.5 rounded-xl">+ Aggiungi</button>
                    </div>
                  ))}
                  <div className="text-[10px] font-bold uppercase text-slate-400 pt-2">Alimenti Freschi Base</div>
                  {FRESH_BASE_FOODS.map(item => (
                    <div key={item.id} className="p-2.5 rounded-xl border border-slate-200 flex justify-between items-center">
                      <div>
                        <div className="text-xs font-bold">{item.name}</div>
                        <div className="text-[10px] text-slate-500">{item.kcal} kcal/100g • P:{item.p}g C:{item.c}g F:{item.f}g</div>
                      </div>
                      <button onClick={() => addFood(item)} className="bg-slate-900 text-white text-xs font-bold px-3 py-1.5 rounded-xl">+ Aggiungi</button>
                    </div>
                  ))}
                </div>
              )}

              {searchMode === 'custom' && (
                <div className="space-y-2.5">
                  <input type="text" placeholder="Nome alimento (es. Lasagna fatta in casa)" value={customFood.name} onChange={e => setCustomFood({ ...customFood, name: e.target.value })} className="w-full px-3 py-2 border rounded-xl text-xs" />
                  <div className="grid grid-cols-4 gap-2">
                    <input type="number" placeholder="Kcal/100g" value={customFood.kcal} onChange={e => setCustomFood({ ...customFood, kcal: e.target.value })} className="px-2 py-2 border rounded-xl text-xs" />
                    <input type="number" placeholder="Prot (g)" value={customFood.p} onChange={e => setCustomFood({ ...customFood, p: e.target.value })} className="px-2 py-2 border rounded-xl text-xs" />
                    <input type="number" placeholder="Carb (g)" value={customFood.c} onChange={e => setCustomFood({ ...customFood, c: e.target.value })} className="px-2 py-2 border rounded-xl text-xs" />
                    <input type="number" placeholder="Grassi (g)" value={customFood.f} onChange={e => setCustomFood({ ...customFood, f: e.target.value })} className="px-2 py-2 border rounded-xl text-xs" />
                  </div>
                  <button
                    onClick={() => {
                      if (!customFood.name || !customFood.kcal) return;
                      addFood({
                        id: 'c_' + Date.now(),
                        name: customFood.name,
                        brand: 'Personalizzato',
                        kcal: Number(customFood.kcal),
                        p: Number(customFood.p || 0),
                        c: Number(customFood.c || 0),
                        f: Number(customFood.f || 0),
                        isOnline: true
                      });
                      setCustomFood({ name: '', brand: '', kcal: '', p: '', c: '', f: '' });
                    }}
                    className="w-full py-2.5 bg-emerald-600 text-white font-bold text-xs rounded-xl"
                  >
                    Salva e Aggiungi
                  </button>
                </div>
              )}
            </div>
          )}

          {/* =================================================================
              TAB 4: PARAMETRI FISIOLOGICI & TARGET BASE
          ================================================================= */}
          {activeTab === 'profile' && (
            <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
              <h2 className="font-extrabold text-sm">Parametri Antropometrici & Target Base</h2>
              <div className="grid grid-cols-2 gap-2.5 text-xs">
                <div>
                  <label className="font-bold text-slate-600">Peso Corporeo (kg)</label>
                  <input type="number" step="0.5" value={profile.weight} onChange={e => setProfile({ ...profile, weight: Number(e.target.value) })} className="w-full mt-1 px-3 py-2 border rounded-xl font-bold" />
                </div>
                <div>
                  <label className="font-bold text-slate-600">Altezza (cm)</label>
                  <input type="number" value={profile.height} onChange={e => setProfile({ ...profile, height: Number(e.target.value) })} className="w-full mt-1 px-3 py-2 border rounded-xl font-bold" />
                </div>
                <div>
                  <label className="font-bold text-slate-600">Età (anni)</label>
                  <input type="number" value={profile.age} onChange={e => setProfile({ ...profile, age: Number(e.target.value) })} className="w-full mt-1 px-3 py-2 border rounded-xl font-bold" />
                </div>
                <div>
                  <label className="font-bold text-slate-600">Strategia Energetica</label>
                  <select value={profile.goalMod} onChange={e => setProfile({ ...profile, goalMod: Number(e.target.value) })} className="w-full mt-1 px-3 py-2 border rounded-xl font-bold">
                    <option value={-0.20}>Cut Deciso (-20%)</option>
                    <option value={-0.10}>Definizione (-10%)</option>
                    <option value={0}>Mantenimento Isocalorico (0%)</option>
                    <option value={0.10}>Lean Bulk (+10%)</option>
                    <option value={0.20}>Bulk (+20%)</option>
                  </select>
                </div>
                <div>
                  <label className="font-bold text-slate-600">Proteine (g/kg)</label>
                  <input type="number" step="0.1" value={profile.gPerKgP} onChange={e => setProfile({ ...profile, gPerKgP: Number(e.target.value) })} className="w-full mt-1 px-3 py-2 border rounded-xl font-bold" />
                </div>
                <div>
                  <label className="font-bold text-slate-600">Grassi Base (g/kg)</label>
                  <input type="number" step="0.1" value={profile.gPerKgF} onChange={e => setProfile({ ...profile, gPerKgF: Number(e.target.value) })} className="w-full mt-1 px-3 py-2 border rounded-xl font-bold" />
                </div>
              </div>

              <div className="bg-slate-900 text-white p-3.5 rounded-2xl text-xs grid grid-cols-3 gap-2 text-center">
                <div>
                  <div className="text-slate-400 text-[10px]">BMR (Riposo)</div>
                  <div className="font-extrabold text-sm">{bioenergetics.bmr} kcal</div>
                </div>
                <div>
                  <div className="text-slate-400 text-[10px]">Base Sedentaria</div>
                  <div className="font-extrabold text-sm text-emerald-400">{bioenergetics.baseSedentaryTdee} kcal</div>
                </div>
                <div>
                  <div className="text-slate-400 text-[10px]">Target Oggi</div>
                  <div className="font-extrabold text-sm text-amber-400">{bioenergetics.kcal} kcal</div>
                </div>
              </div>
            </div>
          )}

          {/* =================================================================
              TAB 5: I 3 LIVELLI DI SALVATAGGIO
          ================================================================= */}
          {activeTab === 'vault' && (
            <div className="space-y-3">
              <div className="bg-white p-4 rounded-2xl border border-slate-200 space-y-1.5">
                <span className="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded bg-emerald-100 text-emerald-800">Livello 1 • Automatico</span>
                <h3 className="font-bold text-sm">LocalStorage + IndexedDB Persistente iOS</h3>
                <p className="text-xs text-slate-500">Stato: <strong>Attivo</strong> (Ultimo salvataggio: {vaultStatus.lastLocal || 'Adesso'}).</p>
              </div>

              <div className="bg-white p-4 rounded-2xl border border-slate-200 space-y-2.5">
                <span className="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded bg-blue-100 text-blue-800">Livello 2 • File / iCloud Drive</span>
                <h3 className="font-bold text-sm">Backup Fisico su iPhone</h3>
                <div className="grid grid-cols-2 gap-2">
                  <button onClick={exportJSONBackup} className="bg-blue-600 text-white text-xs font-bold py-2.5 rounded-xl">
                    Salva su File / iCloud
                  </button>
                  <label className="bg-slate-100 text-slate-800 text-xs font-bold py-2.5 rounded-xl text-center cursor-pointer">
                    Importa File JSON
                    <input type="file" accept=".json" onChange={importJSONBackup} className="hidden" />
                  </label>
                </div>
              </div>

              <div className="bg-white p-4 rounded-2xl border border-slate-200 space-y-2.5">
                <span className="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded bg-indigo-100 text-indigo-800">Livello 3 • Cloud Sync</span>
                <h3 className="font-bold text-sm">Sincronizzazione Cloud Multi-Dispositivo</h3>
                <input
                  type="text"
                  value={cloudCfg.syncId}
                  onChange={e => setCloudCfg({ ...cloudCfg, syncId: e.target.value.trim() })}
                  placeholder="Lascia vuoto e premi 'Salva su Cloud' per generare il tuo ID"
                  className="w-full px-3 py-2 border rounded-xl text-xs font-mono bg-slate-50"
                />
                <div className="grid grid-cols-2 gap-2">
                  <button onClick={pushCloud} className="bg-indigo-600 text-white text-xs font-bold py-2.5 rounded-xl">
                    {vaultStatus.syncing ? 'Sincronizzazione...' : 'Salva su Cloud'}
                  </button>
                  <button onClick={pullCloud} className="bg-slate-100 text-slate-800 text-xs font-bold py-2.5 rounded-xl">
                    Scarica da Cloud
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* BARRA DI NAVIGAZIONE INFERIORE A 5 SCHEDE */}
          <nav className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur border-t border-slate-200 z-40" style={{ paddingBottom: 'env(safe-area-inset-bottom)' }}>
            <div className="max-w-lg mx-auto grid grid-cols-5 py-2 text-center">
              <button onClick={() => setActiveTab('diary')} className={`text-[10px] font-bold py-1 ${activeTab === 'diary' ? 'text-emerald-600' : 'text-slate-400'}`}>📋 Diario</button>
              <button onClick={() => setActiveTab('training')} className={`text-[10px] font-bold py-1 ${activeTab === 'training' ? 'text-emerald-600' : 'text-slate-400'}`}>⌚ Sport</button>
              <button onClick={() => setActiveTab('search')} className={`text-[10px] font-bold py-1 ${activeTab === 'search' ? 'text-emerald-600' : 'text-slate-400'}`}>🔍 Cerca</button>
              <button onClick={() => setActiveTab('profile')} className={`text-[10px] font-bold py-1 ${activeTab === 'profile' ? 'text-emerald-600' : 'text-slate-400'}`}>⚙️ Target</button>
              <button onClick={() => setActiveTab('vault')} className={`text-[10px] font-bold py-1 ${activeTab === 'vault' ? 'text-emerald-600' : 'text-slate-400'}`}>🛡️ Backup</button>
            </div>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
